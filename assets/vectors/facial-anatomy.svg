  <circle cx="400" cy="460" r="180" stroke-width="0.8" stroke-dasharray="4 8"/>
  <circle cx="360" cy="550" r="260" stroke-width="0.6"/>
  <line x1="200" y1="370" x2="600" y2="370" stroke-width="0.8" stroke-dasharray="2 4"/>
  <line x1="180" y1="520" x2="620" y2="520" stroke-width="0.8" stroke-dasharray="2 4"/>
  <line x1="220" y1="660" x2="580" y2="660" stroke-width="0.8" stroke-dasharray="2 4"/>
  <!-- Terços faciais: Superior, Médio, Inferior -->
  <text x="640" y="375" font-family="'Manrope', sans-serif" font-size="11" fill="currentColor" letter-spacing="2">1/3 MÉDIO</text>
  <text x="640" y="525" font-family="'Manrope', sans-serif" font-size="11" fill="currentColor" letter-spacing="2">1/3 INFERIOR</text>
  <text x="640" y="665" font-family="'Manrope', sans-serif" font-size="11" fill="currentColor" letter-spacing="2">CERVICAL</text>
</svg>
