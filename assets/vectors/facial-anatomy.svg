<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" stroke="currentColor">
  <!-- Perfil anatômico facial sutil com linhas de vetores de rejuvenescimento -->
  <path d="M 320,100 C 420,100 480,160 480,240 C 480,290 470,330 460,370 C 455,390 465,405 480,415 C 510,435 525,460 520,490 C 510,530 460,545 440,555 C 445,570 455,595 435,620 C 410,645 370,640 355,660 C 335,685 360,740 375,810 C 390,880 410,950 430,1000" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <!-- Linhas de vetores Deep Plane e SMAS -->
  <path d="M 360,420 C 330,460 300,530 330,620 C 350,680 340,760 320,830" stroke-width="1" stroke-dasharray="6 6"/>
  <path d="M 400,450 C 360,520 380,630 395,710" stroke-width="1" stroke-linecap="round"/>
  <!-- Contorno de mandíbula e ângulo mandibular (Goníon ao Mento) -->
  <path d="M 280,600 C 320,680 360,710 440,700" stroke-width="1.5"/>
  <path d="M 280,600 L 260,520" stroke-width="1.2"/>
